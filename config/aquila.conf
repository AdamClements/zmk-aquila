CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_BT=y
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_MANUFACTURER="Adam"
CONFIG_ZMK_KEYBOARD_NAME="Aquila v2.0"
CONFIG_ZMK_SLEEP=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Display config lives in aquila_right.conf — only the right half has an OLED.
# On Zephyr 4.1 a configured display with no panel attached hangs the whole
# boot (before USB init), so it must never be enabled on the knob-only half.
