# SSD1306 OLED on the accessory connector (P0.04 SDA / P0.06 SCL, addr 0x3C)
# — fitted on the screen-equipped left half.
CONFIG_ZMK_DISPLAY=y
# Render on a dedicated thread: the split central's BT work starves the
# system work queue, leaving the screen blank after init.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_I2C=y
CONFIG_SSD1306=y
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_1=y
