# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - board: nice_nano//zmk
    shield: aquila_left
  - board: nice_nano//zmk
    shield: aquila_right
  - board: nice_nano//zmk
    shield: aquila_right
    snippet: zmk-usb-logging
    artifact-name: aquila_right_debug
  - board: nice_nano//zmk
    shield: aquila_right
    cmake-args: -DCONFIG_ZMK_DISPLAY=n -DCONFIG_LVGL=n -DCONFIG_SSD1306=n
    artifact-name: aquila_right_nodisplay
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: settings_reset
  - board: nice_nano//zmk
    shield: aquila_left
    cmake-args: -DCONFIG_ZMK_DISPLAY=n -DCONFIG_LVGL=n -DCONFIG_SSD1306=n
    artifact-name: aquila_left_nodisplay
