# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  - board: nice_nano//zmk
    shield: aquila_left
  - board: nice_nano//zmk
    shield: aquila_right
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: settings_reset
  # Standalone display-test build for the spare screen-fitted left half:
  # split disabled (won't touch the working pair's pairing), display forced on.
  - board: nice_nano//zmk
    shield: aquila_left
    cmake-args: -DCONFIG_ZMK_SPLIT=n -DCONFIG_ZMK_DISPLAY=y -DCONFIG_I2C=y -DCONFIG_SSD1306=y -DCONFIG_LVGL=y -DCONFIG_LV_COLOR_DEPTH_1=y
    artifact-name: aquila_left_screentest
  # Right central with RTT logging: boot log readable over SWD from t=0,
  # even if the boot hangs.
  - board: nice_nano//zmk
    shield: aquila_right
    snippet: zmk-rtt-logging
    artifact-name: aquila_right_central_debug
